# docker compose up --build        -> http://localhost:5000
# Secrets come from server/.env (copy server/.env.example). DB and ML_SERVICE_URL are set here for the containers.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
  ml:
    build: ./ml-service
    restart: unless-stopped
  app:
    build: .
    restart: unless-stopped
    depends_on: [mongo, ml]
    ports: ["5000:5000"]
    env_file: server/.env
    environment:
      NODE_ENV: production
      PORT: "5000"
      DB: mongodb://mongo:27017/weatherx
      ML_SERVICE_URL: http://ml:8001
volumes:
  mongo-data:
